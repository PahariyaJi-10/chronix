services:

  postgres:
    image: postgres:17
    container_name: chronix-postgres
    environment:
      POSTGRES_DB: chronix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Divyansh@10
    ports:
      - "5432:5432"
    volumes:
      - chronix-postgres-data:/var/lib/postgresql/data

  chronix:
    build: .
    container_name: chronix-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chronix
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Divyansh@10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  chronix-postgres-data: